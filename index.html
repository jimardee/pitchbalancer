<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PitchBalancer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .dragging { opacity: 0.35; transform: scale(0.98); }
    .drag-over { background-color: rgba(16, 185, 129, 0.08); border-color: #10b981 !important; }
    .drag-target-player { border-color: #38bdf8 !important; background-color: rgba(56, 189, 248, 0.1) !important; }
    .touch-card { -webkit-touch-callout: none; }
    .touch-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.85;
      transform: translate(-50%, -50%) scale(1.03);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 py-6 sm:py-8">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 mb-6 sm:mb-8 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl shadow-lg shadow-emerald-500/10 shrink-0">
          ⚽
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">PitchBalancer</h1>
            <span id="sync-status" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-medium">Connecting...</span>
          </div>
          <p class="text-xs text-slate-400">Position, ability & coach squad balancer</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="openSyncModal()" class="px-3 py-1.5 text-xs font-semibold bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 rounded-lg hover:bg-indigo-600/30 hover:text-white transition flex items-center gap-1.5">
          <span>🔄</span> Backup / Sync
        </button>
        <button onclick="resetToImportedDefault()" class="px-3 py-1.5 text-xs font-semibold bg-slate-900 border border-slate-700 text-slate-300 rounded-lg hover:bg-slate-800 hover:text-white transition">
          Reset Default
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8">

      <!-- Squad & Attendance Section -->
      <section class="lg:col-span-5 flex flex-col gap-4">
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">

          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="text-base sm:text-lg font-bold text-white">Squad Attendance</h2>
              <p class="text-xs text-slate-400 mt-0.5">
                Attending: <span id="attending-count" class="font-bold text-emerald-400">0</span> / <span id="total-count">0</span>
              </p>
            </div>
            <div class="flex gap-2">
              <button onclick="toggleAllAttendance(true)" class="text-xs px-2.5 sm:px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 rounded-lg transition font-semibold">
                ✓ All
              </button>
              <button onclick="toggleAllAttendance(false)" class="text-xs px-2.5 sm:px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 rounded-lg transition font-medium">
                ✕ None
              </button>
            </div>
          </div>

          <!-- Add Player -->
          <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 mb-4">
            <span class="text-[11px] font-bold tracking-wider uppercase text-slate-400 block mb-2">Add Player</span>
            <div class="flex gap-2 mb-2">
              <input id="quick-name" type="text" placeholder="Name..." class="bg-slate-900 border border-slate-700/80 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500 flex-1 min-w-0">
              <input id="quick-rating" type="number" min="1" max="10" value="5" class="bg-slate-900 border border-slate-700/80 rounded-lg px-2 py-1.5 text-sm text-center text-white w-14 focus:outline-none focus:border-emerald-500" title="Ability">
              <button onclick="addQuickPlayer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3 rounded-lg transition shadow">Add</button>
            </div>
            <div class="mb-2">
              <input id="quick-coach" type="text" placeholder="Coach/Dad (optional)..." class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-3 py-1 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex flex-wrap gap-1" id="quick-add-tags"></div>
          </div>

          <!-- Search -->
          <div class="mb-3">
            <input id="player-search" oninput="renderSquadList()" type="text" placeholder="Search roster by name, coach, or tag..." class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-slate-600">
          </div>

          <!-- List -->
          <div id="players-container" class="space-y-2 max-h-[420px] sm:max-h-[500px] overflow-y-auto pr-1"></div>
        </div>
      </section>

      <!-- Teams & Controls -->
      <section class="lg:col-span-7 flex flex-col gap-5">

        <!-- Controls Bar -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 sm:p-4 shadow-xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
          <div class="flex items-center gap-1 bg-slate-950 p-1 border border-slate-800 rounded-xl justify-center sm:justify-start">
            <button onclick="setActiveView('detailed')" id="view-tab-detailed" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-bold transition bg-emerald-600 text-white shadow">
              Detailed
            </button>
            <button onclick="setActiveView('basic')" id="view-tab-basic" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">
              Basic
            </button>
            <button onclick="setActiveView('whatsapp')" id="view-tab-whatsapp" class="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white flex items-center justify-center gap-1">
              <span>💬</span> WhatsApp
            </button>
          </div>

          <div class="flex items-center gap-2 justify-between sm:justify-end">
            <div class="inline-flex rounded-lg bg-slate-950 p-1 border border-slate-800">
              <button onclick="setTeamCount(2)" id="btn-team-2" class="px-3 py-1 rounded-md text-xs font-bold transition bg-emerald-600 text-white shadow">2</button>
              <button onclick="setTeamCount(3)" id="btn-team-3" class="px-3 py-1 rounded-md text-xs font-bold transition text-slate-400 hover:text-white">3</button>
              <button onclick="setTeamCount(4)" id="btn-team-4" class="px-3 py-1 rounded-md text-xs font-bold transition text-slate-400 hover:text-white">4</button>
            </div>
            <button onclick="balanceTeams()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-md transition">
              ⚡ Re-pick
            </button>
          </div>
        </div>

        <!-- Output View Container -->
        <div id="teams-output-container"></div>
      </section>
    </div>
  </div>

  <!-- Mobile Transfer Modal -->
  <div id="transfer-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <span>⇄</span> Move <span id="transfer-player-name" class="text-emerald-400 font-bold"></span>
        </h3>
        <button onclick="closeTransferModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>
      <p class="text-xs text-slate-400 mb-4">Select destination team:</p>
      <div id="transfer-teams-list" class="space-y-2"></div>
    </div>
  </div>

  <!-- Sync Modal -->
  <div id="sync-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
        <div>
          <h3 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
            <span>🔄</span> Sync Squad Between Devices
          </h3>
          <p class="text-xs text-slate-400 mt-0.5">Transfer between phone and PC</p>
        </div>
        <button onclick="closeSyncModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-300 block mb-1">Squad Sync Code</label>
          <textarea id="sync-json-textarea" rows="4" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-2.5 text-xs text-slate-300 font-mono focus:outline-none focus:border-indigo-500"></textarea>
          <div class="flex gap-2 mt-2">
            <button onclick="copySyncCode()" class="flex-1 px-3 py-2 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 rounded-lg text-xs font-semibold transition">
              📋 Copy Code
            </button>
            <button onclick="importSyncCode()" class="flex-1 px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold transition shadow">
              📥 Import
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3 my-2">
          <hr class="border-slate-800 flex-1">
          <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">File Backup</span>
          <hr class="border-slate-800 flex-1">
        </div>

        <div class="flex gap-2">
          <button onclick="downloadRosterFile()" class="flex-1 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium transition">
            💾 Download File
          </button>
          <label class="flex-1 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium transition text-center cursor-pointer">
            📁 Upload File
            <input type="file" id="sync-file-input" accept=".json" onchange="uploadRosterFile(event)" class="hidden">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Player Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
        <h3 class="text-base font-bold text-white">Edit Player</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>

      <input type="hidden" id="modal-player-id">
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-400 block mb-1">Name</label>
          <input id="modal-player-name" type="text" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-400 block mb-1">Coach / Dad</label>
          <input id="modal-player-coach" type="text" placeholder="e.g. Mark, James, Ian, Craig" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-400 block mb-1">Ability Rating (1 - 10)</label>
          <input id="modal-player-rating" type="number" min="1" max="10" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-400 block mb-1.5">Positions &amp; Attributes</label>
          <div class="flex flex-wrap gap-1" id="modal-player-tags"></div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-5 pt-3 border-t border-slate-800">
        <button onclick="closeEditModal()" class="px-3 py-1.5 text-xs font-semibold text-slate-400 hover:text-white rounded-lg transition">Cancel</button>
        <button onclick="savePlayerEdit()" class="px-4 py-1.5 text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow transition">Save</button>
      </div>
    </div>
  </div>

  <script>
    // Configured with your Firebase credentials
    const firebaseConfig = {
      apiKey: "AIzaSyB2bb_gAELMxcD4b8Y6_FS7nKSfAnodhaw",
      authDomain: "pitchbalancer-db.firebaseapp.com",
      databaseURL: "https://pitchbalancer-db-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pitchbalancer-db",
      storageBucket: "pitchbalancer-db.firebasestorage.app",
      messagingSenderId: "390593831860",
      appId: "1:390593831860:web:8d978a93743eb8a171c8e1"
    };

    // Initialize Firebase Database
    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.error("Firebase init error:", e);
    }

    // Positions are stored in the player's tags in order of strength (first = strongest)
    const POSITIONS = ["Goalkeeper", "Defender", "Midfield", "Winger", "Striker"];
    const TRAITS = ["Creative", "Tackler", "Development", "Pace"];
    const ALL_TAGS = [...POSITIONS, ...TRAITS];
    const POSITION_SHORT = { Goalkeeper: "GK", Defender: "DEF", Midfield: "MID", Winger: "WIN", Striker: "STR" };
    // How much a player counts towards a position: 1st choice full, 2nd most of it, and so on
    const POSITION_WEIGHTS = [1, 0.6, 0.35, 0.2, 0.1];

    function getPositions(player) {
      return (player.tags || []).filter(t => POSITIONS.includes(t));
    }
    function getTraits(player) {
      return (player.tags || []).filter(t => TRAITS.includes(t));
    }
    // Keep positions first (in the order chosen) then attributes
    function orderedTags(selectedSet) {
      const list = Array.from(selectedSet);
      return [...list.filter(t => POSITIONS.includes(t)), ...list.filter(t => TRAITS.includes(t))];
    }

    function tagPickerHtml(selected, toggleFn, clearFn, large) {
      const size = large ? 'text-xs px-2.5 py-1 rounded-lg' : 'text-[10px] px-2 py-0.5 rounded';
      const order = Array.from(selected).filter(t => POSITIONS.includes(t));
      const off = large ? 'bg-slate-950 text-slate-400 border-slate-800 hover:border-slate-700' : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700';
      const on = 'bg-emerald-500/30 text-emerald-200 border-emerald-400 font-semibold';
      const posButtons = POSITIONS.map(tag => {
        const rank = order.indexOf(tag);
        return `<button type="button" onclick="${toggleFn}('${tag}')" class="${size} border transition ${rank >= 0 ? on : off}">
            ${rank >= 0 ? `<span class="inline-flex items-center justify-center h-4 w-4 rounded-full bg-emerald-500 text-white text-[9px] font-bold mr-0.5">${rank + 1}</span>` : ''}${tag}
          </button>`;
      }).join('');
      const traitButtons = TRAITS.map(tag => {
        const isSelected = selected.has(tag);
        return `<button type="button" onclick="${toggleFn}('${tag}')" class="${size} border transition ${isSelected ? on : off}">
            ${isSelected ? '✓ ' : ''}${tag}
          </button>`;
      }).join('');
      return `
        <div class="w-full flex items-center justify-between text-[10px] text-slate-400 mb-0.5">
          <span>Positions: tap in order, strongest first</span>
          ${order.length ? `<button type="button" onclick="${clearFn}()" class="text-slate-500 hover:text-white underline">Clear positions</button>` : ''}
        </div>
        ${posButtons}
        <div class="w-full text-[10px] text-slate-400 mt-1.5 mb-0.5">Attributes</div>
        ${traitButtons}`;
    }

    function playerTagsHtml(player) {
      const positions = getPositions(player);
      const traits = getTraits(player);
      if (positions.length === 0 && traits.length === 0) return '';
      return `
        <div class="flex flex-wrap gap-1 pl-6">
          ${positions.map((t, i) => `
            <span class="text-[9px] px-1.5 py-px rounded border ${TAG_COLORS[t]} ${i === 0 ? 'font-bold' : 'opacity-80'}" title="${i + 1}${['st','nd','rd'][i] || 'th'} choice">
              ${i + 1}. ${t}
            </span>`).join('')}
          ${traits.map(t => `
            <span class="text-[9px] px-1.5 py-px rounded border ${TAG_COLORS[t]}">${t}</span>`).join('')}
        </div>`;
    }

    const TAG_COLORS = {
      "Goalkeeper": "bg-amber-500/15 text-amber-300 border-amber-500/30",
      "Defender": "bg-blue-500/15 text-blue-300 border-blue-500/30",
      "Midfield": "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
      "Winger": "bg-cyan-500/15 text-cyan-300 border-cyan-500/30",
      "Striker": "bg-rose-500/15 text-rose-300 border-rose-500/30",
      "Creative": "bg-purple-500/15 text-purple-300 border-purple-500/30",
      "Tackler": "bg-orange-500/15 text-orange-300 border-orange-500/30",
      "Development": "bg-pink-500/15 text-pink-300 border-pink-500/30",
      "Pace": "bg-yellow-500/15 text-yellow-300 border-yellow-500/30"
    };

    const DEFAULT_ROSTER = [{"id":"p1","name":"Caiden","rating":7,"coach":null,"tags":["Goalkeeper","Midfield","Winger","Striker","Pace"],"attending":true},{"id":"p3","name":"Declan","rating":6,"coach":null,"tags":["Midfield","Winger","Striker"],"attending":true},{"id":"p4","name":"Dexter","rating":5,"coach":null,"tags":["Midfield","Winger","Striker"],"attending":true},{"id":"p5","name":"Esa","rating":7,"coach":null,"tags":["Winger","Striker","Pace"],"attending":true},{"id":"p6","name":"Finn","rating":9,"coach":"Ian","tags":["Winger","Striker","Pace"],"attending":true},{"id":"p7","name":"Griff","rating":1,"coach":null,"tags":["Winger","Striker","Development"],"attending":true},{"id":"p8","name":"Ishaaq","rating":7,"coach":null,"tags":["Defender","Midfield","Tackler"],"attending":true},{"id":"p9","name":"Jacob M","rating":5,"coach":null,"tags":["Defender","Midfield"],"attending":true},{"id":"p10","name":"Jacob P","rating":4,"coach":null,"tags":["Winger","Striker"],"attending":true},{"id":"p11","name":"Jake","rating":1,"coach":null,"tags":["Goalkeeper","Development"],"attending":true},{"id":"p12","name":"Jax","rating":9,"coach":"Mark","tags":["Defender","Midfield","Winger","Tackler"],"attending":true},{"id":"p13","name":"Jaylen","rating":1,"coach":null,"tags":["Striker","Development"],"attending":true},{"id":"p14","name":"Joydon","rating":6,"coach":null,"tags":["Defender","Tackler"],"attending":true},{"id":"p15","name":"Khalid","rating":1,"coach":null,"tags":["Striker","Development"],"attending":true},{"id":"p16","name":"Mason","rating":8,"coach":null,"tags":["Midfield","Winger","Striker","Pace"],"attending":true},{"id":"p17","name":"Mohammed","rating":1,"coach":null,"tags":["Midfield","Development"],"attending":true},{"id":"p18","name":"Noah","rating":3,"coach":null,"tags":["Winger","Striker","Development"],"attending":true},{"id":"p19","name":"Quinn","rating":7,"coach":"James","tags":["Goalkeeper","Defender","Midfield","Striker","Tackler"],"attending":true},{"id":"p20","name":"Rafa","rating":8,"coach":null,"tags":["Midfield","Winger","Creative"],"attending":true},{"id":"p21","name":"Sam","rating":1,"coach":null,"tags":["Goalkeeper","Development"],"attending":true},{"id":"p22","name":"Tommy","rating":8,"coach":"Craig","tags":["Defender","Midfield","Creative"],"attending":true},{"id":"p23","name":"Zac","rating":8,"coach":null,"tags":["Defender"],"attending":true}];

    let players = [];
    let numberOfTeams = 2;
    let generatedTeams = [];
    let currentView = 'detailed';
    let quickSelectedTags = new Set();
    let modalSelectedTags = new Set();
    let draggedPlayerId = null;
    let sourceTeamIndex = null;
    let pendingTransferPlayer = null;

    const TEAM_THEMES = [
      { name: "Team 1", border: "border-emerald-500/40", pill: "bg-emerald-500", text: "text-emerald-400" },
      { name: "Team 2", border: "border-sky-500/40", pill: "bg-sky-500", text: "text-sky-400" },
      { name: "Team 3", border: "border-rose-500/40", pill: "bg-rose-500", text: "text-rose-400" },
      { name: "Team 4", border: "border-amber-500/40", pill: "bg-amber-500", text: "text-amber-400" }
    ];

    function init() {
      renderQuickAddTags();
      setupTouchDragAndDrop();

      if (db) {
        let firstLoad = true;
        db.ref('pitchbalancer/roster').on('value', (snapshot) => {
          const cloudPlayers = normalizePlayers(snapshot.val());
          if (cloudPlayers.length > 0) {
            players = cloudPlayers;
          } else {
            players = JSON.parse(JSON.stringify(DEFAULT_ROSTER));
            savePlayers();
          }
          setSyncBadge('cloud');
          renderSquadList();
          if (firstLoad) {
            firstLoad = false;
            balanceTeams();
          } else {
            syncTeamsWithRoster();
          }
        }, (error) => {
          console.warn("Falling back to local cache:", error);
          loadLocalFallback();
        });
      } else {
        loadLocalFallback();
      }
    }

    function setSyncBadge(mode) {
      const syncBadge = document.getElementById('sync-status');
      if (!syncBadge) return;
      const styles = {
        cloud: ['☁️ Live Cloud', 'bg-emerald-950 text-emerald-300 border-emerald-800'],
        local: ['💾 Local Mode', 'bg-amber-950 text-amber-300 border-amber-800'],
        error: ['⚠️ Not saved to cloud', 'bg-rose-950 text-rose-300 border-rose-800']
      };
      const [text, cls] = styles[mode];
      syncBadge.textContent = text;

      return list
        .filter(p => p && typeof p.name === 'string' && p.name.trim())
        .map((p, i) => ({
          id: p.id ? String(p.id) : `p_${Date.now()}_${i}`,
          name: p.name.trim(),
          rating: Math.max(1, Math.min(10, parseInt(p.rating, 10) || 5)),
          coach: typeof p.coach === 'string' && p.coach.trim() ? p.coach.trim() : null,
          tags: Array.isArray(p.tags) ? p.tags.filter(t => ALL_TAGS.includes(t)) : [],

    function setTeamCount(count) {
      numberOfTeams = count;
      [2, 3, 4].forEach(n => {
        const btn = document.getElementById(`btn-team-${n}`);
        if (n === count) btn.className = "px-3 py-1 rounded-md text-xs font-bold transition bg-emerald-600 text-white shadow";
        else btn.className = "px-3 py-1 rounded-md text-xs font-bold transition text-slate-400 hover:text-white";
      });
      balanceTeams();
    }

    function calculatePenalty(teams) {
      let penalty = 0;
      const counts = teams.map(t => t.players.length);
      const minCount = Math.min(...counts);
      const maxCount = Math.max(...counts);
      if (maxCount - minCount > 1) penalty += (maxCount - minCount) * 1000000;

      const scores = teams.map(t => t.players.reduce((sum, p) => sum + p.rating, 0));
      penalty += (Math.max(...scores) - Math.min(...scores)) * 10000;

      POSITIONS.forEach(pos => {
        const isKeeper = pos === "Goalkeeper";
        // Position strength per team: 1st-choice players count fully, later choices count less
        const cover = teams.map(t => t.players.reduce((sum, p) => {
          const rank = getPositions(p).indexOf(pos);
          return sum + (rank >= 0 ? (POSITION_WEIGHTS[rank] || 0.1) : 0);
        }, 0));
        penalty += (Math.max(...cover) - Math.min(...cover)) * (isKeeper ? 3000 : 1500);

        // Every team needs someone for each position (as their 1st or 2nd choice;
        // for goalkeeper, anyone willing to go in goal)
        teams.forEach(t => {
          const covered = t.players.some(p => {
            const rank = getPositions(p).indexOf(pos);
            return rank >= 0 && (isKeeper || rank <= 1);
          });
          if (!covered) penalty += 12000;
        });
      });

      // Share out Creative, Tackler and Pace players
      ["Creative", "Tackler", "Pace"].forEach(tag => {
        const tCounts = teams.map(t => t.players.filter(p => (p.tags || []).includes(tag)).length);
        penalty += (Math.max(...tCounts) - Math.min(...tCounts)) * 2500;
      });

      // Spread the coaches' / dads' children so every team has someone on the sideline
      const coachCounts = teams.map(t => t.players.filter(p => p.coach).length);
      penalty += (Math.max(...coachCounts) - Math.min(...coachCounts)) * 3000;

      // Beginners (rated 1, or tagged Development) have little effect on games: share them out equally
      const isBeginner = p => p.rating === 1 || (p.tags || []).includes("Development");
      const beginnerCounts = teams.map(t => t.players.filter(isBeginner).length);
      penalty += (Math.max(...beginnerCounts) - Math.min(...beginnerCounts)) * 8000;

      return penalty;
    }

    // List each team keeper-first, then defenders, midfield, wingers, strikers (by 1st choice)
    function getPositionalHierarchyRank(player) {
      const first = getPositions(player)[0];
      return first ? POSITIONS.indexOf(first) : POSITIONS.length;
    }

    function sortTeamTactically(teamPlayers) {
      return [...teamPlayers].sort((a, b) => {
        const rankA = getPositionalHierarchyRank(a);
        const rankB = getPositionalHierarchyRank(b);
        if (rankA !== rankB) return rankA - rankB;
        return b.rating - a.rating;
      });
    }

    // ---- Team details (names, venues, dates) are remembered on this device ----
    const TEAM_DETAILS_KEY = 'pitchbalancer_team_details_v1';
    let teamDetails = [];
    try { teamDetails = JSON.parse(localStorage.getItem(TEAM_DETAILS_KEY)) || []; } catch (e) { teamDetails = []; }

    function getTeamDetails(i) {
      const d = teamDetails[i] || {};
      return {
        name: d.name || `Team ${i + 1}`,
        venue: d.venue !== undefined ? d.venue : `Pitch ${i + 1}`,
        date: d.date !== undefined ? d.date : "Saturday Morning",
        meetTime: d.meetTime !== undefined ? d.meetTime : "09:30 AM (10:00 KO)"
      };
    }

    function saveTeamDetail(i, field, value) {
      teamDetails[i] = { ...getTeamDetails(i), ...(teamDetails[i] || {}), [field]: value };
      try { localStorage.setItem(TEAM_DETAILS_KEY, JSON.stringify(teamDetails)); } catch (e) {}
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // One attempt: share players out (strongest first, with a little randomness), then keep
    // swapping pairs between teams while that makes the teams fairer.
    function buildTeamsAttempt(pool, targetSizes) {
      const teams = targetSizes.map(() => ({ players: [] }));
      const order = shuffle([...pool]).sort((a, b) => (b.rating + Math.random() * 1.5) - (a.rating + Math.random() * 1.5));

      order.forEach(player => {
        const open = teams
          .map((t, idx) => ({ idx, count: t.players.length, sum: t.players.reduce((s, p) => s + p.rating, 0) }))
          .filter(t => t.count < targetSizes[t.idx]);
        open.sort((a, b) => a.sum - b.sum || Math.random() - 0.5);
        teams[open[0].idx].players.push(player);
      });

      let currentPenalty = calculatePenalty(teams);
      let improved = true;
      let iterations = 0;
      while (improved && iterations < 250) {
        improved = false;
        iterations++;
        outer:
        for (let i = 0; i < teams.length; i++) {
          for (let j = i + 1; j < teams.length; j++) {
            const A = teams[i].players, B = teams[j].players;
            for (let a = 0; a < A.length; a++) {
              for (let b = 0; b < B.length; b++) {
                const pA = A[a], pB = B[b];
                A[a] = pB; B[b] = pA;
                const newPenalty = calculatePenalty(teams);
                if (newPenalty < currentPenalty) {
                  currentPenalty = newPenalty;
                  improved = true;
                  break outer;
                }
                A[a] = pA; B[b] = pB;
              }
            }
          }
        }
      }
      return { teams, penalty: currentPenalty };
    }

    function teamsSignature(teams) {
      return teams.map(t => t.players.map(p => p.id).sort().join(',')).sort().join('|');
    }

    // Re-pick: try lots of fair line-ups and choose one of the best at random,
    // avoiding the line-up already on screen where possible.
    function balanceTeams() {
      const pool = players.filter(p => p.attending);
      if (pool.length < numberOfTeams) {
        generatedTeams = [];
        renderCurrentView();
        return;
      }

      const baseSize = Math.floor(pool.length / numberOfTeams);
      const remainder = pool.length % numberOfTeams;
      const targetSizes = Array.from({ length: numberOfTeams }, (_, i) => baseSize + (i < remainder ? 1 : 0));

      const attempts = [];
      for (let k = 0; k < 40; k++) attempts.push(buildTeamsAttempt(pool, targetSizes));
      const best = Math.min(...attempts.map(a => a.penalty));
      const TOLERANCE = 2000; // only picks line-ups almost as fair as the best found

      const currentSig = generatedTeams.length === numberOfTeams ? teamsSignature(generatedTeams) : null;
      const seen = new Set();
      let candidates = attempts.filter(a => {
        if (a.penalty > best + TOLERANCE) return false;
        const sig = teamsSignature(a.teams);
        if (seen.has(sig)) return false;
        seen.add(sig);
        return true;
      });
      const fresh = candidates.filter(a => teamsSignature(a.teams) !== currentSig);
      if (fresh.length > 0) candidates = fresh;
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];

      generatedTeams = chosen.teams.map((t, i) => ({
        ...getTeamDetails(i),
        players: sortTeamTactically(t.players)
      }));
      renderCurrentView();
    }

    // When the squad changes (attendance ticked, player edited, change from another phone),
    // update the existing teams instead of re-picking, so manual moves are kept.
    function syncTeamsWithRoster() {
      const attending = players.filter(p => p.attending);
      if (generatedTeams.length !== numberOfTeams || attending.length < numberOfTeams) {
        balanceTeams();
        return;
      }
      const byId = new Map(attending.map(p => [p.id, p]));
      const placed = new Set();
      generatedTeams.forEach(team => {
        team.players = team.players.filter(p => byId.has(p.id)).map(p => byId.get(p.id));
        team.players.forEach(p => placed.add(p.id));
      });
      attending.filter(p => !placed.has(p.id)).forEach(p => {
        const target = [...generatedTeams].sort((a, b) =>
          a.players.length - b.players.length ||
          a.players.reduce((s, x) => s + x.rating, 0) - b.players.reduce((s, x) => s + x.rating, 0)
        )[0];
        target.players.push(p);
      });
      renderCurrentView();
    }

    function updateTeamDetail(teamIdx, field, value) {
      if (generatedTeams[teamIdx]) {
        generatedTeams[teamIdx][field] = value;
        saveTeamDetail(teamIdx, field, value);
      }
    }

    function renderBasicView() {
      const container = document.getElementById('teams-output-container');
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${generatedTeams.map((team, tIdx) => {
            const theme = TEAM_THEMES[tIdx % TEAM_THEMES.length];
            const coaches = team.players.filter(p => p.coach).map(p => p.coach);

            return `
              <div class="team-drop-zone bg-slate-900/90 border ${theme.border} rounded-2xl p-4 shadow-xl flex flex-col justify-between"
                   data-team-index="${tIdx}"
                   ondragover="handleDragOver(event)"
                   ondragleave="handleDragLeave(event)"
                   ondrop="handleDrop(event, ${tIdx})">
                <div>
                  <div class="flex items-center justify-between pb-2 border-b border-slate-800/80 mb-2">
                    <div>
                      <input type="text" value="${escapeHtml(team.name)}" onchange="renameTeam(${tIdx}, this.value)"
                             class="bg-transparent font-bold text-sm sm:text-base text-white hover:border-b border-dashed border-slate-600 focus:outline-none focus:border-solid focus:border-emerald-400">
                      <div class="text-xs text-slate-400 mt-0.5">
                        ${team.players.length} players
                      </div>
                    </div>
                    <div class="h-3 w-3 rounded-full ${theme.pill}"></div>
                  </div>

                  <div class="mb-3 px-2.5 py-1.5 rounded-lg bg-slate-950/70 border border-slate-800 flex items-center justify-between text-xs">
                    <span class="text-slate-400 text-[10px] font-semibold uppercase tracking-wider">Sideline Coaches</span>
                    <span class="font-medium text-xs ${coaches.length > 0 ? 'text-indigo-300' : 'text-slate-500'}">
                      ${coaches.length > 0 ? `👔 ${coaches.join(', ')}` : 'None'}
                    </span>
                  </div>

                  <div class="space-y-2 min-h-[120px]">
                    ${team.players.map((player, pIdx) => `
                      <div draggable="true"
                           data-player-id="${player.id}"
                           data-player-index="${pIdx}"
                           data-team-index="${tIdx}"
                           ondragstart="handleDragStart(event, '${player.id}', ${tIdx})"
                           ondragend="handleDragEnd(event)"
                           class="touch-card flex items-center justify-between bg-slate-950/80 border border-slate-800 p-2.5 sm:p-3 rounded-xl cursor-grab active:cursor-grabbing hover:border-slate-700 transition shadow-sm select-none">
                        <div class="flex items-center gap-2.5 min-w-0">
                          <div class="flex flex-col gap-0.5 shrink-0">
                            <button onclick="movePlayerOrder(${tIdx}, ${pIdx}, -1)" ${pIdx === 0 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:text-emerald-400 text-slate-400 active:scale-110 transition"'} title="Move up">
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path></svg>
                            </button>
                            <button onclick="movePlayerOrder(${tIdx}, ${pIdx}, 1)" ${pIdx === team.players.length - 1 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:text-emerald-400 text-slate-400 active:scale-110 transition"'} title="Move down">
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                          </div>

                          <span class="text-[20px] font-bold text-white tracking-wide truncate leading-none">${escapeHtml(player.name)}</span>
                          ${player.coach ? `
                            <span class="text-[10px] px-2 py-0.5 rounded bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 font-semibold shrink-0">
                              👔 ${escapeHtml(player.coach)}
                            </span>
                          ` : ''}
                        </div>

                        <button onclick="openTransferModal('${player.id}', ${tIdx})" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 active:bg-emerald-600 text-slate-300 hover:text-white rounded-lg border border-slate-700 transition shrink-0 font-bold" title="Transfer to another team">
                          ⇄
                        </button>
                      </div>
                    `).join('')}
                  </div>
                </div>
                <p class="text-[10px] text-center text-slate-500 mt-4 border-t border-slate-800/40 pt-2">
                  Use ▲ / ▼ to reorder · drag a card (press and hold on a phone) or tap ⇄ to move teams
                </p>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderDetailedView() {
      const container = document.getElementById('teams-output-container');
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${generatedTeams.map((team, tIdx) => {
            const totalRating = team.players.reduce((acc, p) => acc + p.rating, 0);
            const avgRating = team.players.length > 0 ? (totalRating / team.players.length).toFixed(1) : 0;
            const theme = TEAM_THEMES[tIdx % TEAM_THEMES.length];
            const coaches = team.players.filter(p => p.coach).map(p => p.coach);

            const firstChoice = pos => team.players.filter(p => getPositions(p)[0] === pos).length;

            return `
              <div class="team-drop-zone bg-slate-900/90 border ${theme.border} rounded-2xl p-4 shadow-xl flex flex-col justify-between"
                   data-team-index="${tIdx}"
                   ondragover="handleDragOver(event)"
                   ondragleave="handleDragLeave(event)"
                   ondrop="handleDrop(event, ${tIdx})">
                <div>
                  <div class="flex items-center justify-between pb-2 border-b border-slate-800/80 mb-2">
                    <div>
                      <input type="text" value="${escapeHtml(team.name)}" onchange="renameTeam(${tIdx}, this.value)"
                             class="bg-transparent font-bold text-sm sm:text-base text-white hover:border-b border-dashed border-slate-600 focus:outline-none focus:border-solid focus:border-emerald-400">
                      <div class="text-xs text-slate-400 mt-0.5">
                        ${team.players.length} players &bull; Total: <span class="text-emerald-400 font-semibold">${totalRating}</span> &bull; Avg: <span class="text-slate-300">${avgRating}</span>
                      </div>
                    </div>
                    <div class="h-3 w-3 rounded-full ${theme.pill}"></div>
                  </div>

                  <div class="mb-2 px-2 py-1.5 rounded-lg bg-slate-950/40 border border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400" title="Players whose 1st choice is each position">
                    <span>GK: <b class="text-amber-300">${firstChoice("Goalkeeper")}</b></span>
                    <span>DEF: <b class="text-blue-300">${firstChoice("Defender")}</b></span>
                    <span>MID: <b class="text-emerald-300">${firstChoice("Midfield")}</b></span>
                    <span>WIN: <b class="text-cyan-300">${firstChoice("Winger")}</b></span>
                    <span>STR: <b class="text-rose-300">${firstChoice("Striker")}</b></span>
                  </div>

                  <div class="mb-3 px-2.5 py-1 rounded-lg bg-slate-950/70 border border-slate-800 flex items-center justify-between text-xs">
                    <span class="text-slate-400 text-[10px] font-semibold uppercase tracking-wider">Sideline Coaches</span>
                    <span class="font-medium text-xs ${coaches.length > 0 ? 'text-indigo-300' : 'text-slate-500'}">
                      ${coaches.length > 0 ? `👔 ${coaches.join(', ')}` : 'None'}
                    </span>
                  </div>

                  <div class="space-y-2 min-h-[120px]">
                    ${team.players.map((player, pIdx) => `
                      <div draggable="true"
                           data-player-id="${player.id}"
                           data-player-index="${pIdx}"
                           data-team-index="${tIdx}"
                           ondragstart="handleDragStart(event, '${player.id}', ${tIdx})"
                           ondragend="handleDragEnd(event)"
                           class="touch-card flex flex-col gap-1.5 bg-slate-950/80 border border-slate-800 p-2 sm:p-2.5 rounded-xl cursor-grab active:cursor-grabbing hover:border-slate-700 transition shadow-sm select-none">

                        <div class="flex items-center justify-between">
                          <div class="flex items-center gap-2 min-w-0">
                            <div class="flex flex-col gap-0.5 shrink-0">
                              <button onclick="movePlayerOrder(${tIdx}, ${pIdx}, -1)" ${pIdx === 0 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:text-emerald-400 text-slate-400 active:scale-110 transition"'} title="Move up">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path></svg>
                              </button>
                              <button onclick="movePlayerOrder(${tIdx}, ${pIdx}, 1)" ${pIdx === team.players.length - 1 ? 'disabled class="opacity-20 cursor-not-allowed"' : 'class="hover:text-emerald-400 text-slate-400 active:scale-110 transition"'} title="Move down">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                              </button>
                            </div>

                            <span class="text-[19px] font-bold text-white tracking-wide truncate leading-none">${escapeHtml(player.name)}</span>
                            ${player.coach ? `
                              <span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 font-medium shrink-0">
                                👔 ${escapeHtml(player.coach)}
                              </span>
                            ` : ''}
                          </div>

                          <div class="flex items-center gap-1.5 shrink-0">
                            <span class="px-2 py-0.5 text-xs font-bold rounded-md bg-black border border-slate-700 text-slate-200">
                              ${player.rating}
                            </span>
                            <button onclick="openTransferModal('${player.id}', ${tIdx})" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-slate-700 active:bg-emerald-600 text-slate-300 rounded border border-slate-700" title="Transfer Player">
                              ⇄
                            </button>
                          </div>
                        </div>

                        ${playerTagsHtml(player)}
                      </div>
                    `).join('')}
                  </div>
                </div>
                <p class="text-[10px] text-center text-slate-500 mt-4 border-t border-slate-800/40 pt-2">
                  Use ▲ / ▼ to reorder · drag a card (press and hold on a phone) or tap ⇄ to move teams
                </p>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renameTeam(idx, newName) {
      if (generatedTeams[idx]) {
        generatedTeams[idx].name = newName;
        saveTeamDetail(idx, 'name', newName);
      }
    }

    function openTransferModal(playerId, currentTeamIdx) {
      pendingTransferPlayer = { playerId, currentTeamIdx };
      let playerObj = null;
      generatedTeams[currentTeamIdx].players.forEach(p => { if (p.id === playerId) playerObj = p; });
      if (!playerObj) return;

      document.getElementById('transfer-player-name').textContent = playerObj.name;
      const listContainer = document.getElementById('transfer-teams-list');

      listContainer.innerHTML = generatedTeams.map((t, idx) => {
        if (idx === currentTeamIdx) return '';
        const theme = TEAM_THEMES[idx % TEAM_THEMES.length];
        return `
          <button onclick="executeTransfer(${idx})" class="w-full flex items-center justify-between p-3 rounded-xl bg-slate-950 border ${theme.border} hover:bg-slate-900 transition text-left">
            <span class="text-sm font-semibold text-white flex items-center gap-2">
              <span class="h-2 w-2 rounded-full ${theme.pill}"></span>
              ${escapeHtml(t.name)}
            </span>
            <span class="text-xs text-slate-400 font-medium">Move here →</span>
          </button>
        `;
      }).join('');

      document.getElementById('transfer-modal').classList.remove('hidden');
    }

    function closeTransferModal() {
      document.getElementById('transfer-modal').classList.add('hidden');
      pendingTransferPlayer = null;
    }

    function executeTransfer(targetTeamIdx) {
      if (!pendingTransferPlayer) return;
      const { playerId, currentTeamIdx } = pendingTransferPlayer;
      const sourceTeam = generatedTeams[currentTeamIdx];
      const targetTeam = generatedTeams[targetTeamIdx];

      const pIdx = sourceTeam.players.findIndex(p => p.id === playerId);
      if (pIdx > -1) {
        const [player] = sourceTeam.players.splice(pIdx, 1);
        targetTeam.players.push(player);
      }
      closeTransferModal();
      renderCurrentView();
    }

    // Phone dragging: press and hold a player card for a moment, then drag.
    // A normal swipe still scrolls the page.
    let touchCandidate = null;
    let touchDraggingElement = null;
    let touchClone = null;
    let touchSourceTeam = null;
    let touchHoldTimer = null;
    let touchStartPoint = null;
    const HOLD_MS = 300;

    function clearTouchHighlights() {
      document.querySelectorAll('.team-drop-zone').forEach(el => el.classList.remove('drag-over'));
      document.querySelectorAll('.touch-card').forEach(el => el.classList.remove('drag-target-player'));
    }

    function cancelTouchDrag() {
      clearTimeout(touchHoldTimer);
      touchHoldTimer = null;
      if (touchClone) { touchClone.remove(); touchClone = null; }
      if (touchDraggingElement) touchDraggingElement.classList.remove('dragging');
      clearTouchHighlights();
      touchCandidate = null;
      touchDraggingElement = null;
      touchSourceTeam = null;
    }

    function setupTouchDragAndDrop() {
      document.addEventListener('touchstart', function(e) {
        const card = e.target.closest('.touch-card');
        if (!card || e.target.closest('button') || e.target.closest('input') || e.touches.length > 1) return;
        const touch = e.touches[0];
        touchCandidate = card;
        touchStartPoint = { x: touch.clientX, y: touch.clientY };
        clearTimeout(touchHoldTimer);
        touchHoldTimer = setTimeout(() => {
          if (!touchCandidate) return;
          touchDraggingElement = touchCandidate;
          touchSourceTeam = parseInt(touchDraggingElement.getAttribute('data-team-index'), 10);
          touchClone = touchDraggingElement.cloneNode(true);
          touchClone.classList.add('touch-clone');
          touchClone.style.width = touchDraggingElement.offsetWidth + 'px';
          touchClone.style.left = touchStartPoint.x + 'px';
          touchClone.style.top = touchStartPoint.y + 'px';
          document.body.appendChild(touchClone);
          touchDraggingElement.classList.add('dragging');
          if (navigator.vibrate) navigator.vibrate(15);
        }, HOLD_MS);
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        const touch = e.touches[0];
        if (!touchDraggingElement) {
          // Moved before the hold finished: it's a scroll, not a drag
          if (touchCandidate && touchStartPoint &&
              Math.hypot(touch.clientX - touchStartPoint.x, touch.clientY - touchStartPoint.y) > 10) {
            cancelTouchDrag();
          }
          return;
        }
        e.preventDefault(); // stop the page scrolling while dragging
        touchClone.style.left = touch.clientX + 'px';
        touchClone.style.top = touch.clientY + 'px';

        const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
        clearTouchHighlights();
        if (elemBelow) {
          const targetCard = elemBelow.closest('.touch-card');
          if (targetCard && targetCard !== touchDraggingElement) {
            targetCard.classList.add('drag-target-player');
          } else {
            const zone = elemBelow.closest('.team-drop-zone');
            if (zone) zone.classList.add('drag-over');
          }
        }
      }, { passive: false });

      document.addEventListener('touchend', function(e) {
        if (!touchDraggingElement) { cancelTouchDrag(); return; }
        const touch = e.changedTouches[0];
        const dragged = touchDraggingElement;
        const fromTeam = touchSourceTeam;
        if (touchClone) touchClone.style.display = 'none';
        const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
        cancelTouchDrag();

        if (elemBelow) {
          const targetCard = elemBelow.closest('.touch-card');
          const targetZone = elemBelow.closest('.team-drop-zone');
          const pId = dragged.getAttribute('data-player-id');

          if (targetCard && targetCard !== dragged) {
            const targetTeamIdx = parseInt(targetCard.getAttribute('data-team-index'), 10);
            const targetPlayerIdx = parseInt(targetCard.getAttribute('data-player-index'), 10);
            applyDropInsertion(fromTeam, pId, targetTeamIdx, targetPlayerIdx);
          } else if (targetZone) {
            const targetTeamIdx = parseInt(targetZone.getAttribute('data-team-index'), 10);
            if (!isNaN(targetTeamIdx) && targetTeamIdx !== fromTeam) {
              applyDropInsertion(fromTeam, pId, targetTeamIdx, null);
            }
          }
        }
      });

      document.addEventListener('touchcancel', cancelTouchDrag);
      // Stop the phone's long-press menu appearing on player cards
      document.addEventListener('contextmenu', function(e) {
        if (e.target.closest('.touch-card')) e.preventDefault();
      });
    }

    function handleDragStart(e, playerId, teamIdx) {
      draggedPlayerId = playerId;
      sourceTeamIndex = teamIdx;
      e.target.classList.add('dragging');
      e.dataTransfer.setData('text/plain', playerId);
    }
    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      document.querySelectorAll('.drag-target-player').forEach(el => el.classList.remove('drag-target-player'));
    }
    function handleDragOver(e) {
      e.preventDefault();
      const card = e.target.closest('.touch-card');
      document.querySelectorAll('.drag-target-player').forEach(el => el.classList.remove('drag-target-player'));
      if (card && card.getAttribute('data-player-id') !== draggedPlayerId) {
        card.classList.add('drag-target-player');
      } else {
        const dropZone = e.currentTarget;
        if (!dropZone.classList.contains('drag-over')) dropZone.classList.add('drag-over');
      }
    }
    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
      const card = e.target.closest('.touch-card');
      if (card) card.classList.remove('drag-target-player');
    }
    function handleDrop(e, targetTeamIndex) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      document.querySelectorAll('.drag-target-player').forEach(el => el.classList.remove('drag-target-player'));

      const targetCard = e.target.closest('.touch-card');
      let targetPlayerIndex = null;
      if (targetCard) {
        targetPlayerIndex = parseInt(targetCard.getAttribute('data-player-index'), 10);
      }

      applyDropInsertion(sourceTeamIndex, draggedPlayerId, targetTeamIndex, targetPlayerIndex);
    }

    function applyDropInsertion(fromTeamIdx, pId, toTeamIdx, targetPlayerIdx) {
      if (fromTeamIdx === null || isNaN(toTeamIdx)) return;

      const sourceTeam = generatedTeams[fromTeamIdx];
      const targetTeam = generatedTeams[toTeamIdx];
      const fromIdx = sourceTeam.players.findIndex(p => p.id === pId);
      if (fromIdx === -1) return;

      const [player] = sourceTeam.players.splice(fromIdx, 1);

      if (targetPlayerIdx !== null && !isNaN(targetPlayerIdx)) {
        targetTeam.players.splice(targetPlayerIdx, 0, player);
      } else {
        targetTeam.players.push(player);
      }

      renderCurrentView();
    }

    function copyWhatsAppPost() {
      if (!generatedTeams || generatedTeams.length === 0) return;
      let text = `⚽ *MATCH DAY TEAMS & DETAILS* ⚽\n\n`;

      generatedTeams.forEach((team) => {
        text += `*${team.name}* (${team.players.length} players)\n`;
        text += `📍 *Venue:* ${team.venue || 'TBC'}\n`;
        text += `📅 *Date:* ${team.date || 'TBC'}\n`;
        text += `⏰ *Meet Time:* ${team.meetTime || 'TBC'}\n`;
        text += `*Squad:*\n`;
        team.players.forEach(p => { text += `• ${p.name}\n`; });
        text += `\n---------------------------\n\n`;
      });

      navigator.clipboard.writeText(text.trim()).then(() => {
        alert("All match details and teams copied to clipboard!");
      });
    }

    function copySingleTeamWhatsApp(tIdx) {
      const team = generatedTeams[tIdx];
      if (!team) return;

      let text = `⚽ *MATCH DETAILS: ${team.name.toUpperCase()}* ⚽\n\n`;
      text += `📍 *Venue:* ${team.venue || 'TBC'}\n`;
      text += `📅 *Date:* ${team.date || 'TBC'}\n`;
      text += `⏰ *Meet Time:* ${team.meetTime || 'TBC'}\n\n`;
      text += `*Squad (${team.players.length} players):*\n`;
      team.players.forEach(p => { text += `• ${p.name}\n`; });

      navigator.clipboard.writeText(text.trim()).then(() => {
        alert(`Copied lineup and details for ${team.name}!`);
      });
    }

    function escapeHtml(string) {
      const div = document.createElement('div');
      div.textContent = string;
      return div.innerHTML;
    }

    window.onload = init;
  </script>
</body>
</html>
